<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 780" width="100%" height="100%">
  <defs>
    <filter id="seqShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1050" height="780" fill="#f8fafc" rx="12"/>

  <!-- Title -->
  <rect x="25" y="20" width="1000" height="50" rx="8" fill="#1e3a8a"/>
  <text x="525" y="52" fill="#ffffff" font-family="system-ui, sans-serif" font-size="17" font-weight="bold" text-anchor="middle">
    SmartLMS: UML SEQUENCE DIAGRAM (RFID SCAN → KERNEL DRIVER → C++ WORKER → IOCTL ACTUATION)
  </text>

  <!-- Lifeline Headers -->
  <!-- 1. Physical RFID Sensor -->
  <rect x="50" y="90" width="130" height="45" rx="6" fill="#3b82f6" filter="url(#seqShadow)"/>
  <text x="115" y="118" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">RFID / Hardware</text>
  <line x1="115" y1="135" x2="115" y2="720" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- 2. Linux Kernel Driver -->
  <rect x="230" y="90" width="145" height="45" rx="6" fill="#f97316" filter="url(#seqShadow)"/>
  <text x="302" y="112" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">Kernel Driver</text>
  <text x="302" y="126" fill="#fed7aa" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">/dev/libsys_driver</text>
  <line x1="302" y1="135" x2="302" y2="720" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- 3. Poller Daemon Thread -->
  <rect x="425" y="90" width="145" height="45" rx="6" fill="#059669" filter="url(#seqShadow)"/>
  <text x="497" y="112" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">Scanner Poller</text>
  <text x="497" y="126" fill="#d1fae5" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">POSIX Thread (HAL)</text>
  <line x1="497" y1="135" x2="497" y2="720" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- 4. Circulation Engine -->
  <rect x="620" y="90" width="145" height="45" rx="6" fill="#6366f1" filter="url(#seqShadow)"/>
  <text x="692" y="112" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">CirculationEngine</text>
  <text x="692" y="126" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">C++ Core Manager</text>
  <line x1="692" y1="135" x2="692" y2="720" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- 5. Shared Memory Telemetry -->
  <rect x="815" y="90" width="155" height="45" rx="6" fill="#0284c7" filter="url(#seqShadow)"/>
  <text x="892" y="112" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">POSIX Telemetry</text>
  <text x="892" y="126" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">/libsys_telemetry (shm)</text>
  <line x1="892" y1="135" x2="892" y2="720" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- STEP 1: Poller Thread blocks on driver read -->
  <line x1="497" y1="165" x2="302" y2="165" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="400" y="157" fill="#1e40af" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">1: read() [blocking on wait_event]</text>

  <!-- STEP 2: Physical RFID scan event occurs -->
  <line x1="115" y1="210" x2="302" y2="210" stroke="#f97316" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="208" y="202" fill="#c2410c" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">2: Hardware Scan (Tag UID, Gate ID)</text>

  <!-- Kernel internal ring buffer push -->
  <rect x="290" y="225" width="130" height="35" rx="4" fill="#ffedd5" stroke="#fed7aa"/>
  <text x="355" y="240" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">enqueue_event(FIFO)</text>
  <text x="355" y="253" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">wake_up_interruptible()</text>

  <!-- STEP 3: Kernel wakes up poller thread and copies event -->
  <line x1="302" y1="285" x2="497" y2="285" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowGreen)"/>
  <text x="400" y="278" fill="#15803d" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">3: copy_to_user() → event data returned</text>

  <!-- STEP 4: Poller dispatches to Circulation Engine -->
  <line x1="497" y1="330" x2="692" y2="330" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="595" y="322" fill="#1e40af" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">4: processEvent(HardwareEvent)</text>

  <!-- Core Processing Frame: Drop-Box Return vs Gate Scan -->
  <rect x="635" y="350" width="170" height="40" rx="4" fill="#ede9fe" stroke="#c4b5fd"/>
  <text x="720" y="367" fill="#4338ca" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Lookup Catalog &amp; Active Loans</text>
  <text x="720" y="381" fill="#4338ca" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Check Overdue &amp; Quota</text>

  <!-- STEP 5A: Case Return -> Unlock Solenoid -->
  <line x1="692" y1="430" x2="302" y2="430" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="497" y="422" fill="#15803d" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">5a: ioctl(LMS_IOCTL_SET_DROPBOX_LOCK, UNLOCKED)</text>

  <!-- Actuate Solenoid -->
  <line x1="302" y1="465" x2="115" y2="465" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="208" y="457" fill="#15803d" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">Actuate Solenoid Flap (Release lock)</text>

  <!-- STEP 5B: Alternative Security Breach Alert -->
  <rect x="55" y="495" width="940" height="95" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-dasharray="4,3"/>
  <text x="70" y="515" fill="#b91c1c" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">[ALT BRANCH: Unborrowed Book Passes Security Gate]</text>

  <line x1="692" y1="540" x2="302" y2="540" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <text x="497" y="533" fill="#b91c1c" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">ioctl(LMS_IOCTL_SET_SECURITY_GATE, ALARM_TRIGGER)</text>

  <line x1="302" y1="570" x2="115" y2="570" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <text x="208" y="563" fill="#b91c1c" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">Fire Strobe &amp; Audio Alarm Buzzer</text>

  <!-- STEP 6: Update POSIX Shared Memory Telemetry -->
  <line x1="692" y1="625" x2="892" y2="625" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="792" y="617" fill="#0369a1" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">6: atomic_update_telemetry()</text>

  <rect x="835" y="640" width="150" height="35" rx="4" fill="#e0f2fe" stroke="#bae6fd"/>
  <text x="910" y="655" fill="#0369a1" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">Total Loans, Returns,</text>
  <text x="910" y="668" fill="#0369a1" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">Active Alarms Updated</text>

  <!-- STEP 7: Poller loops back to blocking read -->
  <line x1="497" y1="695" x2="302" y2="695" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="400" y="688" fill="#1e40af" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">7: Re-enter wait_event_interruptible() loop</text>
</svg>
