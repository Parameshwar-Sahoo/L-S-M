<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" width="100%" height="100%">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="uiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="ipcGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="kernelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1000" height="780" fill="#0f172a" rx="16"/>

  <!-- Title Banner -->
  <rect x="25" y="25" width="950" height="60" rx="10" fill="url(#headerGrad)" filter="url(#shadow)"/>
  <text x="500" y="55" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" letter-spacing="1">
    SmartLMS: 3-TIER SYSTEM ARCHITECTURE
  </text>
  <text x="500" y="74" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">
    Linux Kernel Device Driver • POSIX System Programming • Modern C++ Circulation Engine
  </text>

  <!-- LAYER 1: PRESENTATION & UI -->
  <rect x="40" y="105" width="920" height="110" rx="10" fill="url(#uiGrad)" filter="url(#shadow)"/>
  <text x="60" y="130" fill="#334155" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">
    TIER 1: PRESENTATION &amp; OPERATIONAL INTERFACES (USER SPACE)
  </text>

  <!-- TUI Box -->
  <rect x="60" y="145" width="415" height="58" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="267" y="170" fill="#1e293b" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Terminal UI (ANSI Console Kiosk)</text>
  <text x="267" y="188" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Interactive Menu • Real-time Event Monitor • Shelf Locator</text>

  <!-- Web Dashboard Box -->
  <rect x="505" y="145" width="435" height="58" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="722" y="170" fill="#1e293b" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Live Web Visualizer &amp; Dashboard</text>
  <text x="722" y="188" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">HTML5/CSS3 Rack Grid • DropBox Animation • Telemetry Client</text>

  <!-- LAYER 2: APPLICATION & DOMAIN LOGIC -->
  <rect x="40" y="235" width="920" height="135" rx="10" fill="url(#coreGrad)" filter="url(#shadow)"/>
  <text x="60" y="260" fill="#1e40af" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">
    TIER 2: MODERN C++ APPLICATION ENGINE &amp; DOMAIN LOGIC
  </text>

  <!-- Core Component Boxes -->
  <rect x="60" y="275" width="205" height="80" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="162" y="302" fill="#1e3a8a" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">CatalogManager</text>
  <text x="162" y="322" fill="#475569" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">Multi-key Hash Indexing</text>
  <text x="162" y="338" fill="#475569" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">Shelf / Rack Map &amp; ESL</text>

  <rect x="285" y="275" width="205" height="80" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="387" y="302" fill="#1e3a8a" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">CirculationManager</text>
  <text x="387" y="322" fill="#475569" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">Atomic Loans &amp; Returns</text>
  <text x="387" y="338" fill="#475569" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">Role Quota &amp; Fines</text>

  <rect x="510" y="275" width="205" height="80" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="612" y="302" fill="#1e3a8a" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">SecurityGateManager</text>
  <text x="612" y="322" fill="#475569" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">Active Loan Tag Matcher</text>
  <text x="612" y="338" fill="#475569" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">Siren / Alarm Trigger</text>

  <rect x="735" y="275" width="205" height="80" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="837" y="302" fill="#1e3a8a" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">HardwareFactory (HAL)</text>
  <text x="837" y="322" fill="#475569" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">ILibraryHardware Interface</text>
  <text x="837" y="338" fill="#475569" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">Auto Fallback Mechanism</text>

  <!-- LAYER 3: POSIX SYSTEM PROGRAMMING MIDDLEWARE -->
  <rect x="40" y="390" width="920" height="135" rx="10" fill="url(#ipcGrad)" filter="url(#shadow)"/>
  <text x="60" y="415" fill="#065f46" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">
    TIER 3: POSIX SYSTEM PROGRAMMING &amp; IPC MIDDLEWARE
  </text>

  <!-- IPC Subsystems -->
  <rect x="60" y="430" width="205" height="80" rx="6" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
  <text x="162" y="457" fill="#047857" font-family="system-ui, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle">Worker Thread Pool</text>
  <text x="162" y="477" fill="#475569" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">Scanner Poller Daemon</text>
  <text x="162" y="493" fill="#475569" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">pthread / std::thread</text>

  <rect x="285" y="430" width="205" height="80" rx="6" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
  <text x="387" y="457" fill="#047857" font-family="system-ui, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle">POSIX Shared Memory</text>
  <text x="387" y="477" fill="#475569" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">shm_open / mmap</text>
  <text x="387" y="493" fill="#475569" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">/libsys_telemetry Buffer</text>

  <rect x="510" y="430" width="205" height="80" rx="6" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
  <text x="612" y="457" fill="#047857" font-family="system-ui, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle">POSIX Signal Handler</text>
  <text x="612" y="477" fill="#475569" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">sigaction() Registration</text>
  <text x="612" y="493" fill="#475569" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">SIGINT, SIGTERM, SIGUSR1</text>

  <rect x="735" y="430" width="205" height="80" rx="6" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
  <text x="837" y="457" fill="#047857" font-family="system-ui, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle">Audit &amp; Data Storage</text>
  <text x="837" y="477" fill="#475569" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">Thread-safe Append Journal</text>
  <text x="837" y="493" fill="#475569" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">JSON Catalog Persistence</text>

  <!-- VFS BOUNDARY -->
  <line x1="40" y1="545" x2="960" y2="545" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,4"/>
  <rect x="420" y="535" width="160" height="20" rx="4" fill="#f59e0b"/>
  <text x="500" y="549" fill="#78350f" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">
    LINUX VFS SYSTEM CALL BOUNDARY
  </text>

  <!-- LAYER 4: KERNEL SPACE DEVICE DRIVER -->
  <rect x="40" y="570" width="920" height="175" rx="10" fill="url(#kernelGrad)" filter="url(#shadow)"/>
  <text x="60" y="595" fill="#9a3412" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">
    LINUX KERNEL CHARACTER DEVICE DRIVER (/dev/libsys_driver)
  </text>

  <!-- Driver Modules -->
  <rect x="60" y="610" width="165" height="115" rx="6" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="142" y="635" fill="#c2410c" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">cdev Registration</text>
  <text x="142" y="655" fill="#475569" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">alloc_chrdev_region()</text>
  <text x="142" y="673" fill="#475569" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">cdev_add()</text>
  <text x="142" y="691" fill="#475569" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">udev / sysfs node</text>

  <rect x="245" y="610" width="225" height="115" rx="6" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="357" y="635" fill="#c2410c" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Circular FIFO Ring Buffer</text>
  <text x="357" y="655" fill="#475569" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">64-Slot Event Queue</text>
  <text x="357" y="673" fill="#475569" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">Spinlock / Mutex Protection</text>
  <text x="357" y="691" fill="#475569" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">wait_event_interruptible()</text>

  <rect x="490" y="610" width="225" height="115" rx="6" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="602" y="635" fill="#c2410c" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">IOCTL Command Engine</text>
  <text x="602" y="655" fill="#475569" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">_IOR / _IOW Command Dispatch</text>
  <text x="602" y="673" fill="#475569" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">Solenoid &amp; Alarm Actuation</text>
  <text x="602" y="691" fill="#475569" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">Diagnostics Injection</text>

  <rect x="735" y="610" width="205" height="115" rx="6" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="837" y="635" fill="#c2410c" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Hardware Subsystems</text>
  <text x="837" y="655" fill="#475569" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">RFID / Barcode Kiosks</text>
  <text x="837" y="673" fill="#475569" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">Drop-Box Solenoid Flap</text>
  <text x="837" y="691" fill="#475569" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">Anti-Theft Siren &amp; LEDs</text>
</svg>
