<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%">
  <defs>
    <filter id="smShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="2.5" flood-opacity="0.15"/>
    </filter>
    <marker id="smArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="smArrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="1000" height="680" fill="#f8fafc" rx="12"/>

  <!-- Title -->
  <rect x="30" y="20" width="940" height="50" rx="8" fill="#1e3a8a"/>
  <text x="500" y="52" fill="#ffffff" font-family="system-ui, sans-serif" font-size="17" font-weight="bold" text-anchor="middle">
    SmartLMS: UML STATE MACHINE (BOOK CIRCULATION &amp; HARDWARE SECURITY LIFECYCLE)
  </text>

  <!-- Initial Pseudo State -->
  <circle cx="80" cy="180" r="14" fill="#1e293b"/>
  <line x1="94" y1="180" x2="160" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#smArrow)"/>
  <text x="127" y="172" fill="#64748b" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">cataloged</text>

  <!-- State 1: AVAILABLE -->
  <g transform="translate(160, 140)" filter="url(#smShadow)">
    <rect width="180" height="80" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
    <rect width="180" height="28" rx="10" fill="#dcfce7"/>
    <text x="90" y="20" fill="#15803d" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">AVAILABLE</text>
    <text x="12" y="46" fill="#334155" font-family="system-ui, sans-serif" font-size="10.5">entry / ArmSecurityTag()</text>
    <text x="12" y="65" fill="#334155" font-family="system-ui, sans-serif" font-size="10.5">do / ShelfLocatorLED(OFF)</text>
  </g>

  <!-- Transition AVAILABLE -> RESERVED -->
  <path d="M 250 140 C 250 90, 420 90, 420 140" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#smArrow)"/>
  <text x="335" y="82" fill="#475569" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">reserveBook() [patron request]</text>

  <!-- State 2: RESERVED -->
  <g transform="translate(420, 140)" filter="url(#smShadow)">
    <rect width="180" height="80" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <rect width="180" height="28" rx="10" fill="#e0f2fe"/>
    <text x="90" y="20" fill="#0369a1" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">RESERVED</text>
    <text x="12" y="46" fill="#334155" font-family="system-ui, sans-serif" font-size="10.5">entry / ShelfLED(BLUE)</text>
    <text x="12" y="65" fill="#334155" font-family="system-ui, sans-serif" font-size="10.5">exit / ShelfLED(OFF)</text>
  </g>

  <!-- Transition RESERVED -> AVAILABLE (Cancel / Expire) -->
  <path d="M 420 190 C 370 210, 350 210, 340 190" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#smArrow)"/>
  <text x="380" y="215" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">holdExpired()</text>

  <!-- Transition AVAILABLE / RESERVED -> CHECKED_OUT -->
  <line x1="250" y1="220" x2="250" y2="340" stroke="#334155" stroke-width="2" marker-end="url(#smArrow)"/>
  <text x="255" y="275" fill="#1e3a8a" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600">kioskCheckout()</text>
  <text x="255" y="292" fill="#64748b" font-family="system-ui, sans-serif" font-size="9.5">[quota valid &amp; card swiped]</text>

  <!-- State 3: CHECKED_OUT -->
  <g transform="translate(160, 340)" filter="url(#smShadow)">
    <rect width="200" height="90" rx="10" fill="#ffffff" stroke="#6366f1" stroke-width="2.5"/>
    <rect width="200" height="28" rx="10" fill="#e0e7ff"/>
    <text x="100" y="20" fill="#4338ca" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">CHECKED_OUT</text>
    <text x="12" y="46" fill="#334155" font-family="system-ui, sans-serif" font-size="10.5">entry / DisarmSecurityBit()</text>
    <text x="12" y="64" fill="#334155" font-family="system-ui, sans-serif" font-size="10.5">entry / StartLoanTimer()</text>
    <text x="12" y="82" fill="#334155" font-family="system-ui, sans-serif" font-size="10.5">exit / RecordTimestamp()</text>
  </g>

  <!-- Transition CHECKED_OUT -> OVERDUE -->
  <line x1="360" y1="385" x2="480" y2="385" stroke="#dc2626" stroke-width="2" marker-end="url(#smArrowRed)"/>
  <text x="420" y="375" fill="#dc2626" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">timer &gt; dueDate</text>

  <!-- State 4: OVERDUE -->
  <g transform="translate(480, 340)" filter="url(#smShadow)">
    <rect width="200" height="90" rx="10" fill="#ffffff" stroke="#ef4444" stroke-width="2.5"/>
    <rect width="200" height="28" rx="10" fill="#fee2e2"/>
    <text x="100" y="20" fill="#b91c1c" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">OVERDUE</text>
    <text x="12" y="46" fill="#334155" font-family="system-ui, sans-serif" font-size="10.5">do / AccumulateDailyFine()</text>
    <text x="12" y="64" fill="#334155" font-family="system-ui, sans-serif" font-size="10.5">do / SendOverdueAlert()</text>
    <text x="12" y="82" fill="#334155" font-family="system-ui, sans-serif" font-size="10.5">entry / FlagPatronAccount()</text>
  </g>

  <!-- State 5: RETURNED_IN_DROPBOX -->
  <g transform="translate(730, 240)" filter="url(#smShadow)">
    <rect width="220" height="90" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5"/>
    <rect width="220" height="28" rx="10" fill="#fef3c7"/>
    <text x="110" y="20" fill="#b45309" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">RETURNED_IN_DROPBOX</text>
    <text x="12" y="46" fill="#334155" font-family="system-ui, sans-serif" font-size="10.5">entry / ActuateSolenoidFlap()</text>
    <text x="12" y="64" fill="#334155" font-family="system-ui, sans-serif" font-size="10.5">entry / CloseActiveLoan()</text>
    <text x="12" y="82" fill="#334155" font-family="system-ui, sans-serif" font-size="10.5">entry / ArmSecurityBit()</text>
  </g>

  <!-- Transitions into RETURNED_IN_DROPBOX -->
  <path d="M 360 360 C 520 310, 630 300, 730 280" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#smArrow)"/>
  <text x="560" y="305" fill="#15803d" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">dropBoxScan(RFID)</text>

  <path d="M 680 370 C 720 350, 725 330, 750 330" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#smArrow)"/>
  <text x="730" y="385" fill="#b91c1c" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">lateReturn() + assessedFine</text>

  <!-- State 6: UNDER_AUDIT_RESHELVING -->
  <g transform="translate(480, 520)" filter="url(#smShadow)">
    <rect width="220" height="85" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <rect width="220" height="28" rx="10" fill="#f1f5f9"/>
    <text x="110" y="20" fill="#334155" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">UNDER_RESHELVING</text>
    <text x="12" y="46" fill="#334155" font-family="system-ui, sans-serif" font-size="10.5">do / PhysicalInspection()</text>
    <text x="12" y="65" fill="#334155" font-family="system-ui, sans-serif" font-size="10.5">entry / ShelfLED(AisleRackGuide)</text>
  </g>

  <path d="M 840 330 C 840 450, 750 540, 700 550" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#smArrow)"/>
  <text x="830" y="470" fill="#475569" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">staffCollectsFromDropBox()</text>

  <!-- UNDER_RESHELVING -> AVAILABLE -->
  <path d="M 480 560 C 220 560, 180 300, 200 220" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#smArrow)"/>
  <text x="280" y="545" fill="#15803d" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600">reshelvedOnRack() [RFID verified at shelf]</text>

  <!-- Final Exit / Lost -->
  <g transform="translate(850, 550)">
    <circle cx="20" cy="20" r="14" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
    <circle cx="20" cy="20" r="8" fill="#dc2626"/>
    <text x="20" y="48" fill="#dc2626" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">LOST / ARCHIVED</text>
  </g>
</svg>
